{% extends "admin/base_site.html" %}

{% block content %}

<h2>Назначить категорию</h2>

<form method="post">
    {% csrf_token %}

    <fieldset class="module aligned">
        {{ form.as_p }}
    </fieldset>

    {% for product in products %}
        <input type="hidden" name="_selected_action" value="{{ product.pk }}">
    {% endfor %}

    <input type="hidden" name="action" value="assign_category">

    <div class="submit-row">
        <input type="submit" name="apply" value="Назначить" class="default">
        <a href="../" class="button cancel-link">Отмена</a>
    </div>

</form>

{% endblock %}
